<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EconAI Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/openseadragon@4.1/build/openseadragon/openseadragon.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }
    #topbar h1 { font-size: 15px; font-weight: 600; color: #e94560; margin-right: 8px; }
    #topbar label { color: #aaa; font-size: 12px; }
    #folder-input {
      flex: 1;
      background: #0f3460;
      border: 1px solid #e94560;
      border-radius: 4px;
      color: #fff;
      padding: 3px 8px;
      font-size: 12px;
    }
    #load-btn {
      background: #e94560;
      border: none;
      border-radius: 4px;
      color: #fff;
      padding: 4px 14px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    #load-btn:hover { background: #c73652; }

    /* ── Main area ── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Left: viewer ── */
    #viewer-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #page-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }
    .nav-btn {
      background: #0f3460;
      border: 1px solid #e94560;
      border-radius: 3px;
      color: #fff;
      padding: 2px 10px;
      cursor: pointer;
      font-size: 12px;
    }
    .nav-btn:hover { background: #e94560; }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }
    #page-label { color: #aaa; font-size: 12px; min-width: 90px; text-align: center; }
    #page-select {
      background: #0f3460;
      border: 1px solid #444;
      border-radius: 3px;
      color: #fff;
      padding: 2px 6px;
      font-size: 12px;
    }

    /* Legend */
    #legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 4px 10px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #ccc;
    }
    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      opacity: 0.75;
    }

    #osd-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* ── Right: correction panel ── */
    #panel {
      width: 320px;
      flex-shrink: 0;
      background: #16213e;
      border-left: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #panel-header {
      padding: 8px 12px;
      background: #0f3460;
      font-size: 12px;
      font-weight: 600;
      color: #e94560;
      border-bottom: 1px solid #e94560;
      flex-shrink: 0;
    }

    #cell-crop-wrap {
      padding: 8px;
      text-align: center;
      background: #111;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
      min-height: 80px;
    }
    #cell-crop {
      max-width: 100%;
      max-height: 140px;
      object-fit: contain;
      display: none;
    }
    #cell-crop-placeholder {
      color: #555;
      font-size: 11px;
      line-height: 80px;
    }

    #panel-fields {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .field-group { display: flex; flex-direction: column; gap: 3px; }
    .field-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
    }
    .field-value {
      background: #0f3460;
      border: 1px solid #1a3a6e;
      border-radius: 3px;
      padding: 5px 7px;
      font-size: 12px;
      color: #ccc;
      min-height: 28px;
      word-break: break-word;
    }
    #human-input {
      background: #0d2a4a;
      border: 1px solid #e94560;
      border-radius: 3px;
      padding: 5px 7px;
      font-size: 12px;
      color: #fff;
      resize: vertical;
      min-height: 60px;
      font-family: inherit;
      width: 100%;
    }
    #human-input:focus { outline: none; border-color: #ff6b81; }

    #cell-meta {
      font-size: 11px;
      color: #777;
    }

    #save-btn {
      background: #e94560;
      border: none;
      border-radius: 4px;
      color: #fff;
      padding: 7px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      width: 100%;
      margin-top: 4px;
    }
    #save-btn:hover { background: #c73652; }
    #save-btn:disabled { opacity: 0.4; cursor: default; }
    #save-status {
      font-size: 11px;
      text-align: center;
      min-height: 16px;
      color: #4caf50;
    }

    #no-selection {
      color: #555;
      font-size: 12px;
      text-align: center;
      margin-top: 30px;
    }

    #mode-btn.active {
      background: #e94560;
      border-color: #e94560;
      color: #fff;
      font-weight: 700;
    }
  </style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <h1>EconAI</h1>
  <label for="folder-input">Folder:</label>
  <input id="folder-input" type="text" placeholder="e.g. samples/kozponti_ertesito" />
  <button id="load-btn" onclick="loadFolder()">Load</button>
</div>

<!-- Main -->
<div id="main">

  <!-- Left: image viewer -->
  <div id="viewer-col">

    <div id="page-nav">
      <button class="nav-btn" id="prev-btn" onclick="goPage(-1)" disabled>&#8592; Prev</button>
      <span id="page-label">— / —</span>
      <button class="nav-btn" id="next-btn" onclick="goPage(+1)" disabled>Next &#8594;</button>
      <select id="page-select" onchange="goPageByIndex(this.value)" style="display:none"></select>
      <div style="flex:1"></div>
      <button class="nav-btn" id="mode-btn" onclick="toggleEditMode()" disabled
              title="Toggle between review and edit mode (E)">Review mode</button>
    </div>

    <div id="legend"></div>

    <div id="osd-container"></div>
  </div>

  <!-- Right: correction panel -->
  <div id="panel">
    <div id="panel-header">Cell inspector</div>
    <div id="cell-crop-wrap">
      <img id="cell-crop" alt="cell crop" />
      <div id="cell-crop-placeholder">Click a cell to inspect</div>
    </div>
    <div id="panel-fields">
      <div id="no-selection">← Click a box on the page</div>
      <div id="fields-content" style="display:none; display:flex; flex-direction:column; gap:10px;">
        <div class="field-group">
          <div class="field-label">Label</div>
          <div id="f-label" class="field-value" style="display:none">—</div>
          <select id="f-label-select" class="field-value" style="display:none;cursor:pointer;background:#0f3460;color:#fff;border:1px solid #e94560;" onchange="changeLabel(this.value)"></select>
        </div>
        <div class="field-group" id="fg-super" style="display:none">
          <div class="field-label">Row / Column</div>
          <div id="f-super" class="field-value">—</div>
        </div>
        <div class="field-group" id="fg-ocr" style="display:none">
          <div class="field-label">OCR (Tesseract)</div>
          <div id="f-ocr" class="field-value">—</div>
        </div>
        <div class="field-group" id="fg-llm" style="display:none">
          <div class="field-label">LLM output</div>
          <div id="f-llm" class="field-value">—</div>
        </div>
        <div class="field-group">
          <div class="field-label">Human correction</div>
          <textarea id="human-input" placeholder="Type correction here…"></textarea>
        </div>
        <button id="save-btn" onclick="saveCorrection()" disabled>Save (Ctrl+S)</button>
        <button id="delete-btn" onclick="deleteSelectedShape()" style="display:none;background:#7f1d1d;border:none;border-radius:4px;color:#fca5a5;padding:7px;cursor:pointer;font-size:13px;font-weight:600;width:100%;">Delete box (Del)</button>
        <div id="save-status"></div>
        <div id="cell-meta" class="field-group"></div>
      </div>
    </div>
  </div>

</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const API = '';
let folder        = '';
let pages         = [];
let pageIdx       = 0;
let pageData      = null;
let selIdx        = -1;          // primary selected shape (for panel display)
let selSet        = new Set();   // all selected indices
let editMode      = false;
let dragState     = null;        // active drag: {type,idx,handle,startX,startY,origPts}
let dragCurrentPts = null;       // live-updated points during drag (primary shape)
let lastUsedLabel  = null;       // remembered label for new box drawing
let projectLabels  = [];         // labels from project config (passed via URL)
let clipboard      = null;       // copied shape for Ctrl+V
const undoStack   = [];          // array of shapes-array snapshots

// ── Undo ────────────────────────────────────────────────────────────────────
function pushUndo() {
  undoStack.push(JSON.parse(JSON.stringify(pageData.shapes)));
  if (undoStack.length > 50) undoStack.shift();
}
async function undo() {
  if (!undoStack.length) return;
  const prev = undoStack.pop();
  pageData.shapes = prev;
  selIdx = -1; selSet.clear();
  const params = new URLSearchParams({folder, stem: pages[pageIdx].stem});
  await fetch(`${API}/api/page/shapes?${params}`, {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ shapes: prev }),
  });
  drawOverlay(); updatePanel();
}

// ── Color palette — fill = label type ──────────────────────────────────────
const PALETTE = [
  '#e94560','#4ecdc4','#ffe66d','#a8e6cf','#ff8b94',
  '#b39ddb','#80cbc4','#ffcc02','#f48fb1','#80deea',
];
let labelColors = {};
function colorFor(label) {
  if (!labelColors[label])
    labelColors[label] = PALETTE[Object.keys(labelColors).length % PALETTE.length];
  return labelColors[label];
}

// ── Processing status borders ───────────────────────────────────────────────
const STATUS_BORDER = {
  human: { color:'#4caf50', width:3   },
  llm:   { color:'#64b5f6', width:2.5 },
  ocr:   { color:'#ffe066', width:2   },
  none:  { color:'#888888', width:1.5 },
};
function statusBorders(shape, selected) {
  const hasHuman = !!shape.human_output?.human_corrected_text;
  const hasLLM   = !!shape.openai_output?.response;
  const hasOCR   = !!shape.tesseract_output?.ocr_text;
  if (selected && !editMode) return [{ color:'#ffffff', width:3, inset:0 }];
  if (hasHuman)         return [{ ...STATUS_BORDER.human, inset:0 }];
  if (hasLLM && hasOCR) return [
    { ...STATUS_BORDER.ocr, inset:0 },
    { ...STATUS_BORDER.llm, inset: STATUS_BORDER.ocr.width + 1 },
  ];
  if (hasLLM) return [{ ...STATUS_BORDER.llm, inset:0 }];
  if (hasOCR) return [{ ...STATUS_BORDER.ocr, inset:0 }];
  return [{ ...STATUS_BORDER.none, inset:0 }];
}

// ── Resize handles ──────────────────────────────────────────────────────────
const HANDLES = ['nw','n','ne','e','se','s','sw','w'];
const HANDLE_SIZE = 8;
const HANDLE_CURSORS = {
  nw:'nw-resize', n:'n-resize', ne:'ne-resize', e:'e-resize',
  se:'se-resize', s:'s-resize', sw:'sw-resize', w:'w-resize',
};
function getHandleCenter(tl, br, h) {
  const cx=(tl.x+br.x)/2, cy=(tl.y+br.y)/2;
  return { nw:{x:tl.x,y:tl.y}, n:{x:cx,y:tl.y}, ne:{x:br.x,y:tl.y},
           e:{x:br.x,y:cy}, se:{x:br.x,y:br.y}, s:{x:cx,y:br.y},
           sw:{x:tl.x,y:br.y}, w:{x:tl.x,y:cy} }[h];
}

// ── OSD + SVG setup ─────────────────────────────────────────────────────────
let viewer = null;
let svgOverlay = null;

function initViewer() {
  if (viewer) viewer.destroy();
  labelColors = {}; editMode = false; dragState = null;

  viewer = OpenSeadragon({
    id: 'osd-container',
    prefixUrl: 'https://cdn.jsdelivr.net/npm/openseadragon@4.1/build/openseadragon/images/',
    showNavigationControl: true, showNavigator: true,
    navigatorPosition: 'BOTTOM_LEFT',
    zoomPerClick: 1,
    gestureSettingsMouse: { clickToZoom: false },
  });

  svgOverlay = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svgOverlay.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;';
  document.getElementById('osd-container').appendChild(svgOverlay);

  viewer.addHandler('open',            () => drawOverlay());
  viewer.addHandler('animation',       () => drawOverlay());
  viewer.addHandler('animation-finish',() => drawOverlay());
  viewer.addHandler('resize',          () => drawOverlay());

  svgOverlay.addEventListener('mousedown', onSvgBackground);
  svgOverlay.addEventListener('contextmenu', e => e.preventDefault());
}

// ── Coordinate helpers ──────────────────────────────────────────────────────
function imgToScreen(x, y) {
  if (!viewer?.viewport || !pageData) return null;
  const vpPt = viewer.viewport.imageToViewportCoordinates(new OpenSeadragon.Point(x, y));
  return viewer.viewport.viewportToViewerElementCoordinates(vpPt);
}
function screenToImg(sx, sy) {
  const r = document.getElementById('osd-container').getBoundingClientRect();
  const vpPt = viewer.viewport.viewerElementToViewportCoordinates(new OpenSeadragon.Point(sx-r.left, sy-r.top));
  return viewer.viewport.viewportToImageCoordinates(vpPt);
}
function screenDeltaToImg(dx, dy) {
  const r  = document.getElementById('osd-container').getBoundingClientRect();
  const cx = r.left+r.width/2, cy = r.top+r.height/2;
  const p0 = screenToImg(cx, cy), p1 = screenToImg(cx+dx, cy+dy);
  return { dx: p1.x-p0.x, dy: p1.y-p0.y };
}

// ── Overlay drawing ─────────────────────────────────────────────────────────
function drawOverlay() {
  if (!svgOverlay || !pageData) return;
  while (svgOverlay.firstChild) svgOverlay.removeChild(svgOverlay.firstChild);
  svgOverlay.style.pointerEvents = editMode ? 'all' : 'none';

  (pageData.shapes || []).forEach((shape, i) => {
    const pts = (() => {
    if (!dragState || !dragCurrentPts) return shape.points;
    if (dragState.type==='resize' && dragState.idx===i) return dragCurrentPts;
    if (dragState.type==='move' && dragState.ptsMap?.[i]) return dragState.ptsMap[i];
    return shape.points;
  })();
    if (!pts || pts.length < 2) return;
    const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
    const tl=imgToScreen(Math.min(...xs),Math.min(...ys));
    const br=imgToScreen(Math.max(...xs),Math.max(...ys));
    if (!tl||!br) return;

    const fillColor = colorFor(shape.label);
    const isSel = selSet.has(i);
    statusBorders(shape, isSel).forEach((border, bi) => {
      const ins=border.inset;
      const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
      rect.setAttribute('x',      tl.x+ins);
      rect.setAttribute('y',      tl.y+ins);
      rect.setAttribute('width',  Math.max(0,br.x-tl.x-ins*2));
      rect.setAttribute('height', Math.max(0,br.y-tl.y-ins*2));
      rect.setAttribute('fill',         bi===0 ? fillColor : 'none');
      rect.setAttribute('fill-opacity', bi===0 ? (isSel?0.35:0.15) : 0);
      rect.setAttribute('stroke',        border.color);
      rect.setAttribute('stroke-width',  border.width);
      rect.setAttribute('stroke-opacity','1');
      rect.style.pointerEvents = 'all';
      rect.style.cursor = editMode ? 'move' : 'pointer';
      rect.addEventListener('mousedown', e => {
        e.stopPropagation();
        const ctrl = e.ctrlKey || e.metaKey;
        if (ctrl) {
          selectShape(i, true);
        } else if (!selSet.has(i)) {
          selectShape(i, false);
        } else {
          selIdx = i; drawOverlay(); updatePanel();
        }
        if (editMode && !ctrl) {
          if (e.button===2) startCopyDrag(e, i);
          else startMoveDrag(e, i);
        }
      });
      rect.addEventListener('contextmenu', e => e.preventDefault());
      svgOverlay.appendChild(rect);
    });

    // Resize handles for selected shape in edit mode
    if (editMode && i===selIdx) {
      HANDLES.forEach(h => {
        const pos = getHandleCenter(tl, br, h);
        const sq = document.createElementNS('http://www.w3.org/2000/svg','rect');
        sq.setAttribute('x',      pos.x-HANDLE_SIZE/2);
        sq.setAttribute('y',      pos.y-HANDLE_SIZE/2);
        sq.setAttribute('width',  HANDLE_SIZE);
        sq.setAttribute('height', HANDLE_SIZE);
        sq.setAttribute('fill','#ffffff');
        sq.setAttribute('stroke','#333333');
        sq.setAttribute('stroke-width','1');
        sq.style.pointerEvents='all'; sq.style.cursor=HANDLE_CURSORS[h];
        sq.addEventListener('mousedown', e => { e.stopPropagation(); startResizeDrag(e,i,h); });
        svgOverlay.appendChild(sq);
      });
    }
  });

  // Ghost outlines for copy-drag (one per mover)
  if (dragState?.type==='copy' && dragState.ptsMap) {
    dragState.movers.forEach(mi => {
      const pts=dragState.ptsMap[mi]; if (!pts) return;
      const tl=imgToScreen(Math.min(pts[0][0],pts[1][0]),Math.min(pts[0][1],pts[1][1]));
      const br=imgToScreen(Math.max(pts[0][0],pts[1][0]),Math.max(pts[0][1],pts[1][1]));
      if (!tl||!br) return;
      const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
      r.setAttribute('x',tl.x); r.setAttribute('y',tl.y);
      r.setAttribute('width',Math.max(0,br.x-tl.x));
      r.setAttribute('height',Math.max(0,br.y-tl.y));
      r.setAttribute('fill','#e94560'); r.setAttribute('fill-opacity','0.15');
      r.setAttribute('stroke','#e94560'); r.setAttribute('stroke-width','2');
      r.setAttribute('stroke-dasharray','6 3');
      svgOverlay.appendChild(r);
    });
  }

  // Rubber-band selection rect
  if (dragState?.type==='select-rect' && dragCurrentPts) {
    const pts=dragCurrentPts;
    const tl=imgToScreen(Math.min(pts[0][0],pts[1][0]),Math.min(pts[0][1],pts[1][1]));
    const br=imgToScreen(Math.max(pts[0][0],pts[1][0]),Math.max(pts[0][1],pts[1][1]));
    if (tl&&br) {
      const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
      r.setAttribute('x',tl.x); r.setAttribute('y',tl.y);
      r.setAttribute('width',Math.max(0,br.x-tl.x));
      r.setAttribute('height',Math.max(0,br.y-tl.y));
      r.setAttribute('fill','#4ecdc4'); r.setAttribute('fill-opacity','0.08');
      r.setAttribute('stroke','#4ecdc4'); r.setAttribute('stroke-width','1.5');
      r.setAttribute('stroke-dasharray','5 3');
      svgOverlay.appendChild(r);
    }
  }

  // In-progress new-box outline
  if (dragState?.type==='draw' && dragCurrentPts) {
    const pts=dragCurrentPts;
    const tl=imgToScreen(Math.min(pts[0][0],pts[1][0]),Math.min(pts[0][1],pts[1][1]));
    const br=imgToScreen(Math.max(pts[0][0],pts[1][0]),Math.max(pts[0][1],pts[1][1]));
    if (tl&&br) {
      const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
      r.setAttribute('x',tl.x); r.setAttribute('y',tl.y);
      r.setAttribute('width',Math.max(0,br.x-tl.x));
      r.setAttribute('height',Math.max(0,br.y-tl.y));
      r.setAttribute('fill','#ffffff'); r.setAttribute('fill-opacity','0.08');
      r.setAttribute('stroke','#ffffff'); r.setAttribute('stroke-width','1.5');
      r.setAttribute('stroke-dasharray','6 3');
      svgOverlay.appendChild(r);
    }
  }
}

// ── Drag: move ──────────────────────────────────────────────────────────────
function startMoveDrag(e, idx) {
  pushUndo();
  viewer.setMouseNavEnabled(false);
  const movers = selSet.has(idx) ? [...selSet] : [idx];
  const origPtsMap = {};
  movers.forEach(i => origPtsMap[i] = pageData.shapes[i].points.map(p=>[...p]));
  dragState = { type:'move', idx, startX:e.clientX, startY:e.clientY, movers, origPtsMap, ptsMap:{...origPtsMap} };
  dragCurrentPts = origPtsMap[idx].map(p=>[...p]);
}

// ── Drag: copy ───────────────────────────────────────────────
function startCopyDrag(e, idx) {
  viewer.setMouseNavEnabled(false);
  const movers = selSet.has(idx) ? [...selSet] : [idx];
  const origPtsMap = {};
  movers.forEach(i => origPtsMap[i] = pageData.shapes[i].points.map(p=>[...p]));
  dragState = { type:'copy', idx, startX:e.clientX, startY:e.clientY, movers, origPtsMap, ptsMap:{...origPtsMap} };
  dragCurrentPts = origPtsMap[idx].map(p=>[...p]);
}

// ── Drag: resize ─────────────────────────────────────────────────────────────
function startResizeDrag(e, idx, handle) {
  pushUndo();
  viewer.setMouseNavEnabled(false);
  dragState = { type:'resize', idx, handle, startX:e.clientX, startY:e.clientY,
                origPts: pageData.shapes[idx].points.map(p=>[...p]) };
  dragCurrentPts = dragState.origPts.map(p=>[...p]);
}
function applyResize(origPts, handle, dxi, dyi) {
  const xs=origPts.map(p=>p[0]), ys=origPts.map(p=>p[1]);
  let x1=Math.min(...xs),y1=Math.min(...ys),x2=Math.max(...xs),y2=Math.max(...ys);
  if (handle.includes('w')) x1+=dxi;
  if (handle.includes('e')) x2+=dxi;
  if (handle.includes('n')) y1+=dyi;
  if (handle.includes('s')) y2+=dyi;
  if (x2-x1<5) { handle.includes('w') ? x1=x2-5 : (x2=x1+5); }
  if (y2-y1<5) { handle.includes('n') ? y1=y2-5 : (y2=y1+5); }
  return [[x1,y1],[x2,y2]];
}

// ── Drag: draw new box OR rubber-band select ─────────────────────────────────
function onSvgBackground(e) {
  if (!editMode || e.target!==svgOverlay) return;
  e.preventDefault();
  viewer.setMouseNavEnabled(false);
  const p=screenToImg(e.clientX, e.clientY);
  if (e.ctrlKey||e.metaKey) {
    // Rubber-band selection — don't clear existing selection, add to it
    dragState = { type:'select-rect', startX:e.clientX, startY:e.clientY,
                  origPts:[[p.x,p.y],[p.x,p.y]] };
    dragCurrentPts = [[p.x,p.y],[p.x,p.y]];
  } else {
    pushUndo();
    const drawLabel = lastUsedLabel || (pageData.shapes.length ? pageData.shapes[pageData.shapes.length-1].label : (projectLabels[0] || 'cell'));
    selIdx = -1; selSet.clear();
    dragState = { type:'draw', startX:e.clientX, startY:e.clientY,
                  origPts:[[p.x,p.y],[p.x,p.y]], drawLabel };
    dragCurrentPts = [[p.x,p.y],[p.x,p.y]];
  }
}

// ── Global mouse tracking ────────────────────────────────────────────────────
window.addEventListener('mousemove', e => {
  if (!dragState) return;
  const dx=e.clientX-dragState.startX, dy=e.clientY-dragState.startY;
  if (dragState.type==='move'||dragState.type==='copy') {
    const d=screenDeltaToImg(dx,dy);
    const ptsMap={};
    dragState.movers.forEach(i => { ptsMap[i]=dragState.origPtsMap[i].map(p=>[p[0]+d.dx,p[1]+d.dy]); });
    dragState.ptsMap=ptsMap;
    dragCurrentPts=ptsMap[dragState.idx];
  } else if (dragState.type==='resize') {
    const d=screenDeltaToImg(dx,dy);
    dragCurrentPts=applyResize(dragState.origPts,dragState.handle,d.dx,d.dy);
  } else if (dragState.type==='draw'||dragState.type==='select-rect') {
    const p=screenToImg(e.clientX,e.clientY);
    dragCurrentPts=[dragState.origPts[0],[p.x,p.y]];
  }
  drawOverlay();
});

window.addEventListener('mouseup', async e => {
  if (!dragState) return;
  const state=dragState; dragState=null;
  viewer.setMouseNavEnabled(!editMode);  // keep nav disabled if still in edit mode

  if (state.type==='select-rect') {
    const pts=dragCurrentPts; dragCurrentPts=null;
    if (!pts) { drawOverlay(); return; }
    const rx1=Math.min(pts[0][0],pts[1][0]), ry1=Math.min(pts[0][1],pts[1][1]);
    const rx2=Math.max(pts[0][0],pts[1][0]), ry2=Math.max(pts[0][1],pts[1][1]);
    (pageData.shapes||[]).forEach((shape,i) => {
      const sp=shape.points||[];
      const sx1=Math.min(sp[0][0],sp[1][0]), sy1=Math.min(sp[0][1],sp[1][1]);
      const sx2=Math.max(sp[0][0],sp[1][0]), sy2=Math.max(sp[0][1],sp[1][1]);
      const overlaps = sx1<rx2 && sx2>rx1 && sy1<ry2 && sy2>ry1;
      if (overlaps) { selSet.add(i); selIdx=i; }
    });
    drawOverlay(); updatePanel();

  } else if (state.type==='resize') {
    pageData.shapes[state.idx].points=dragCurrentPts;
    dragCurrentPts=null; drawOverlay();
    await patchShape(state.idx, { points: pageData.shapes[state.idx].points });
    updatePanel();

  } else if (state.type==='move') {
    dragCurrentPts=null;
    state.movers.forEach(i => { pageData.shapes[i].points=state.ptsMap[i]; });
    drawOverlay();
    await replaceAllShapes();
    updatePanel();

  } else if (state.type==='copy') {
    dragCurrentPts=null;
    const params=new URLSearchParams({folder, stem:pages[pageIdx].stem});
    pushUndo();
    const newIdxs=[];
    for (const i of state.movers) {
      const r=await fetch(`${API}/api/page/shape?${params}`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ label:pageData.shapes[i].label, points:state.ptsMap[i] }),
      });
      if (r.ok) { const data=await r.json(); newIdxs.push(data.idx); }
    }
    await reloadPageData();
    selSet.clear(); selIdx=-1;
    newIdxs.forEach(i => { selSet.add(i); selIdx=i; });
    drawOverlay(); updatePanel();

  } else if (state.type==='draw') {
    const pts=dragCurrentPts; dragCurrentPts=null;
    if (!pts) { drawOverlay(); return; }
    const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
    if (Math.abs(xs[1]-xs[0])<5||Math.abs(ys[1]-ys[0])<5) {
      undoStack.pop(); drawOverlay(); return;
    }
    const label=state.drawLabel;
    const params=new URLSearchParams({folder,stem:pages[pageIdx].stem});
    const body={ label, points:[[Math.min(...xs),Math.min(...ys)],[Math.max(...xs),Math.max(...ys)]] };
    try {
      const r=await fetch(`${API}/api/page/shape?${params}`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body),
      });
      if (r.ok) {
        const data=await r.json();
        await reloadPageData(); selectShape(data.idx);
      } else {
        const txt=await r.text();
        document.getElementById('save-status').textContent=`✗ Error ${r.status}: ${txt.slice(0,80)}`;
        document.getElementById('save-status').style.color='#e94560';
      }
    } catch(err) {
      document.getElementById('save-status').textContent=`✗ ${err.message}`;
      document.getElementById('save-status').style.color='#e94560';
    }
  }
});

// ── Shape operations ─────────────────────────────────────────────────────────
async function patchShape(idx, body) {
  const params=new URLSearchParams({folder,stem:pages[pageIdx].stem,idx});
  await fetch(`${API}/api/page/shape?${params}`,{
    method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body),
  });
}

async function replaceAllShapes() {
  const params=new URLSearchParams({folder,stem:pages[pageIdx].stem});
  await fetch(`${API}/api/page/shapes?${params}`,{
    method:'PUT', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({shapes:pageData.shapes}),
  });
}

function copyShape() {
  if (selSet.size === 0) return;
  clipboard = [...selSet].map(i => JSON.parse(JSON.stringify(pageData.shapes[i])));
}

async function cloneInDirection(arrowKey) {
  if (selSet.size === 0) return;
  const params = new URLSearchParams({folder, stem: pages[pageIdx].stem});
  pushUndo();
  const newIdxs = [];
  for (const i of selSet) {
    const shape = pageData.shapes[i];
    const pts = shape.points;
    const x1=Math.min(pts[0][0],pts[1][0]), y1=Math.min(pts[0][1],pts[1][1]);
    const x2=Math.max(pts[0][0],pts[1][0]), y2=Math.max(pts[0][1],pts[1][1]);
    const w=x2-x1, h=y2-y1;
    let nx1=x1, ny1=y1;
    if (arrowKey==='ArrowRight') nx1=x2;
    else if (arrowKey==='ArrowLeft') nx1=x1-w;
    else if (arrowKey==='ArrowDown') ny1=y2;
    else if (arrowKey==='ArrowUp') ny1=y1-h;
    const r = await fetch(`${API}/api/page/shape?${params}`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ label: shape.label, points: [[nx1,ny1],[nx1+w,ny1+h]] }),
    });
    if (r.ok) { const data = await r.json(); newIdxs.push(data.idx); }
  }
  await reloadPageData();
  selSet.clear(); selIdx=-1;
  newIdxs.forEach(i => { selSet.add(i); selIdx=i; });
  drawOverlay(); updatePanel();
}

async function pasteShape() {
  if (!clipboard?.length) return;
  const OFFSET = 10;
  const params = new URLSearchParams({folder, stem: pages[pageIdx].stem});
  pushUndo();
  const newIdxs = [];
  for (const shape of clipboard) {
    const newPts = shape.points.map(([x,y]) => [x+OFFSET, y+OFFSET]);
    const r = await fetch(`${API}/api/page/shape?${params}`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ label: shape.label, points: newPts }),
    });
    if (r.ok) { const data = await r.json(); newIdxs.push(data.idx); }
  }
  await reloadPageData();
  selSet.clear(); selIdx=-1;
  newIdxs.forEach(i => { selSet.add(i); selIdx=i; });
  drawOverlay(); updatePanel();
}

async function cloneSelectionToPage(delta) {
  if (selSet.size === 0) return;
  const targetIdx = pageIdx + delta;
  if (targetIdx < 0 || targetIdx >= pages.length) return;
  const shapesToClone = [...selSet].map(i => ({
    label: pageData.shapes[i].label,
    points: pageData.shapes[i].points.map(p => [...p]),
  }));
  await loadPage(targetIdx);
  const params = new URLSearchParams({folder, stem: pages[targetIdx].stem});
  const newIdxs = [];
  for (const shape of shapesToClone) {
    const r = await fetch(`${API}/api/page/shape?${params}`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(shape),
    });
    if (r.ok) { const data = await r.json(); newIdxs.push(data.idx); }
  }
  await reloadPageData();
  selSet.clear(); selIdx = -1;
  newIdxs.forEach(i => { selSet.add(i); selIdx = i; });
  drawOverlay(); updatePanel();
}

async function deleteSelectedShape() {
  if (selSet.size === 0) return;
  const count = selSet.size;
  if (!confirm(`Delete ${count} box${count>1?'es':''}?`)) return;
  pushUndo();
  const newShapes = pageData.shapes.filter((_,i) => !selSet.has(i));
  const params = new URLSearchParams({folder, stem: pages[pageIdx].stem});
  await fetch(`${API}/api/page/shapes?${params}`, {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ shapes: newShapes }),
  });
  selSet.clear(); selIdx=-1;
  await reloadPageData(); drawOverlay(); updatePanel();
}

async function changeLabel(newLabel) {
  if (selSet.size === 0) return;
  pushUndo();
  lastUsedLabel = newLabel;
  selSet.forEach(i => { pageData.shapes[i].label = newLabel; });
  await replaceAllShapes();
  drawOverlay();
}

// ── Edit mode toggle ─────────────────────────────────────────────────────────
function toggleEditMode() {
  editMode=!editMode;
  const btn=document.getElementById('mode-btn');
  btn.textContent=editMode?'Edit mode':'Review mode';
  btn.classList.toggle('active',editMode);
  viewer.setMouseNavEnabled(!editMode);
  drawOverlay(); updatePanel();
}

// ── Legend ───────────────────────────────────────────────────────────────────
function legendSwatch({fill,border,borderWidth}) {
  return `<div class="legend-swatch" style="background:${fill};outline:${borderWidth}px solid ${border};outline-offset:-${borderWidth}px"></div>`;
}
function buildLegend() {
  const legend=document.getElementById('legend'); legend.innerHTML='';
  [...new Set((pageData?.shapes||[]).map(s=>s.label))].sort().forEach(lbl=>{
    const div=document.createElement('div'); div.className='legend-item';
    div.innerHTML=`${legendSwatch({fill:colorFor(lbl),border:'#888',borderWidth:1})}<span>${lbl}</span>`;
    legend.appendChild(div);
  });
  const sep=document.createElement('span');
  sep.style.cssText='color:#444;padding:0 4px;'; sep.textContent='│';
  legend.appendChild(sep);
  [{s:STATUS_BORDER.human,label:'Human corrected'},{s:STATUS_BORDER.llm,label:'LLM output'},
   {s:STATUS_BORDER.ocr,label:'OCR only'},{s:STATUS_BORDER.none,label:'Unprocessed'}]
  .forEach(({s,label})=>{
    const div=document.createElement('div'); div.className='legend-item';
    div.innerHTML=`${legendSwatch({fill:'transparent',border:s.color,borderWidth:s.width})}<span>${label}</span>`;
    legend.appendChild(div);
  });
  const combo=document.createElement('div'); combo.className='legend-item';
  const o=STATUS_BORDER.ocr;
  combo.innerHTML=`<div class="legend-swatch" style="background:transparent;outline:${o.width}px solid ${o.color};outline-offset:-${o.width}px;box-shadow:inset 0 0 0 ${o.width+1}px ${STATUS_BORDER.llm.color}"></div><span>OCR+LLM</span>`;
  legend.appendChild(combo);
}

// ── Selection & panel ────────────────────────────────────────────────────────
function selectShape(idx, addToSel=false) {
  if (addToSel && idx >= 0) {
    if (selSet.has(idx)) { selSet.delete(idx); if (selIdx===idx) selIdx=selSet.size>0?[...selSet].at(-1):-1; }
    else { selSet.add(idx); selIdx=idx; }
  } else {
    selSet.clear();
    if (idx >= 0) { selSet.add(idx); selIdx=idx; }
    else selIdx=-1;
  }
  if (idx>=0&&pageData?.shapes[idx]) lastUsedLabel=pageData.shapes[idx].label;
  drawOverlay(); updatePanel();
}

function updatePanel() {
  const noSel=document.getElementById('no-selection');
  const content=document.getElementById('fields-content');
  const cropImg=document.getElementById('cell-crop');
  const cropPh=document.getElementById('cell-crop-placeholder');
  const delBtn=document.getElementById('delete-btn');

  if (selIdx<0||!pageData) {
    noSel.style.display='block'; content.style.display='none';
    cropImg.style.display='none'; cropPh.style.display='block';
    return;
  }
  noSel.style.display='none'; content.style.display='flex';

  // Multi-selection: show simplified panel (label + delete only)
  if (selSet.size > 1) {
    cropImg.style.display='none'; cropPh.style.display='block';
    const staticLbl=document.getElementById('f-label');
    const selectLbl=document.getElementById('f-label-select');
    const labels=[...new Set([...projectLabels,...(pageData.shapes||[]).map(s=>s.label)])].sort();
    const commonLabel=[...selSet].map(i=>pageData.shapes[i]?.label);
    const allSame=commonLabel.every(l=>l===commonLabel[0]);
    staticLbl.style.display='none'; selectLbl.style.display='block';
    selectLbl.innerHTML=labels.map(l=>`<option value="${l}"${allSame&&l===commonLabel[0]?' selected':''}>${l}</option>`).join('');
    document.getElementById('fg-super').style.display='none';
    document.getElementById('fg-ocr').style.display='none';
    document.getElementById('fg-llm').style.display='none';
    document.getElementById('cell-meta').textContent=`${selSet.size} shapes selected`;
    document.getElementById('save-btn').disabled=true;
    document.getElementById('save-status').textContent='';
    delBtn.style.display=editMode?'block':'none';
    return;
  }

  const shape=pageData.shapes[selIdx];

  cropImg.src=`${API}/api/cell?folder=${encodeURIComponent(folder)}&stem=${encodeURIComponent(pages[pageIdx].stem)}&idx=${selIdx}`;
  cropImg.style.display='block'; cropPh.style.display='none';

  // Label: static in review, dropdown in edit
  const staticLbl=document.getElementById('f-label');
  const selectLbl=document.getElementById('f-label-select');
  if (editMode) {
    staticLbl.style.display='none'; selectLbl.style.display='block';
    const labels=[...new Set([...projectLabels, ...(pageData.shapes||[]).map(s=>s.label)])].sort();
    selectLbl.innerHTML=labels.map(l=>`<option value="${l}"${l===shape.label?' selected':''}>${l}</option>`).join('');
  } else {
    staticLbl.style.display='block'; staticLbl.textContent=shape.label||'—';
    selectLbl.style.display='none';
  }
  delBtn.style.display=editMode?'block':'none';

  const fgSuper=document.getElementById('fg-super');
  shape.super_row!=null
    ? (fgSuper.style.display='flex', document.getElementById('f-super').textContent=`row ${shape.super_row}  col ${shape.super_column}`)
    : (fgSuper.style.display='none');

  const ocr=shape.tesseract_output?.ocr_text;
  const fgOcr=document.getElementById('fg-ocr');
  ocr ? (fgOcr.style.display='flex', document.getElementById('f-ocr').textContent=ocr)
      : (fgOcr.style.display='none');

  const llm=shape.openai_output?.response;
  const fgLlm=document.getElementById('fg-llm');
  llm ? (fgLlm.style.display='flex', document.getElementById('f-llm').textContent=llm)
      : (fgLlm.style.display='none');

  document.getElementById('human-input').value=shape.human_output?.human_corrected_text||'';

  const pts=shape.points||[], xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  document.getElementById('cell-meta').textContent=
    `Shape ${selIdx}  •  ${Math.round(Math.max(...xs)-Math.min(...xs))} × ${Math.round(Math.max(...ys)-Math.min(...ys))} px`;
  document.getElementById('save-btn').disabled=false;
  document.getElementById('save-status').textContent='';
}

// ── Save correction text ─────────────────────────────────────────────────────
async function saveCorrection() {
  if (selIdx<0) return;
  const text=document.getElementById('human-input').value;
  const r=await patchShape(selIdx,{human_corrected_text:text});
  if (!pageData.shapes[selIdx].human_output) pageData.shapes[selIdx].human_output={};
  pageData.shapes[selIdx].human_output.human_corrected_text=text;
  document.getElementById('save-status').textContent='✓ Saved';
  setTimeout(()=>document.getElementById('save-status').textContent='',2000);
  drawOverlay();
}

// ── Keyboard shortcuts ───────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const inField=e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'||e.target.tagName==='SELECT';
  if ((e.ctrlKey||e.metaKey)&&e.key==='s') { e.preventDefault(); saveCorrection(); return; }
  if ((e.ctrlKey||e.metaKey)&&e.key==='z') { e.preventDefault(); undo(); return; }
  if ((e.ctrlKey||e.metaKey)&&e.key==='c') { e.preventDefault(); copyShape(); return; }
  if ((e.ctrlKey||e.metaKey)&&e.key==='v') { e.preventDefault(); pasteShape(); return; }
  if ((e.ctrlKey||e.metaKey)&&e.key.startsWith('Arrow')) { e.preventDefault(); cloneInDirection(e.key); return; }
  if (inField) return;
  if (e.key==='Delete'||e.key==='Backspace') { deleteSelectedShape(); return; }
  if (e.key==='e'||e.key==='E') { if(pages.length) toggleEditMode(); return; }
  if (e.key==='n'||e.key==='N') { cloneSelectionToPage(+1); return; }
  if (e.key==='p'||e.key==='P') { cloneSelectionToPage(-1); return; }
  if (e.key==='ArrowRight'||e.key==='ArrowDown') goPage(+1);
  if (e.key==='ArrowLeft' ||e.key==='ArrowUp')   goPage(-1);
});

// ── Page loading ─────────────────────────────────────────────────────────────
async function reloadPageData() {
  const p=pages[pageIdx];
  const r=await fetch(`${API}/api/page?folder=${encodeURIComponent(folder)}&stem=${encodeURIComponent(p.stem)}`);
  pageData=await r.json();
}

async function loadFolder() {
  folder=document.getElementById('folder-input').value.trim();
  if (!folder) return;
  const r=await fetch(`${API}/api/pages?folder=${encodeURIComponent(folder)}`);
  if (!r.ok) { alert('Folder not found: '+folder); return; }
  const data=await r.json(); pages=data.pages;
  if (!pages.length) { alert('No pages found (need matching .json + image)'); return; }
  const sel=document.getElementById('page-select');
  sel.innerHTML=pages.map((p,i)=>`<option value="${i}">${p.stem}</option>`).join('');
  sel.style.display='inline-block';
  document.getElementById('mode-btn').disabled=false;
  pageIdx=0; initViewer(); await loadPage(0);
}

async function loadPage(idx) {
  pageIdx=idx; selIdx=-1; selSet.clear(); editMode=false; dragState=null;
  document.getElementById('prev-btn').disabled=idx===0;
  document.getElementById('next-btn').disabled=idx===pages.length-1;
  document.getElementById('page-label').textContent=`${idx+1} / ${pages.length}`;
  document.getElementById('page-select').value=idx;
  document.getElementById('mode-btn').textContent='Review mode';
  document.getElementById('mode-btn').classList.remove('active');
  updatePanel();
  await reloadPageData();
  viewer.open({type:'image',url:`${API}/api/image?folder=${encodeURIComponent(folder)}&stem=${encodeURIComponent(pages[idx].stem)}`});
  buildLegend();
}

function goPage(delta) { const n=pageIdx+delta; if(n>=0&&n<pages.length) loadPage(n); }
function goPageByIndex(val) { loadPage(parseInt(val)); }

const urlParams=new URLSearchParams(window.location.search);
if (urlParams.get('labels')) {
  projectLabels = urlParams.get('labels').split(',').map(s=>s.trim()).filter(Boolean);
}
if (urlParams.get('folder')) {
  document.getElementById('folder-input').value=urlParams.get('folder');
  loadFolder();
}
