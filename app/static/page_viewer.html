<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Page view</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0a1a; color: #e0e0e0;
  font-family: 'Segoe UI', sans-serif;
  display: flex; flex-direction: column; height: 100vh; overflow: hidden;
}
#bar {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px;
  background: #16213e; border-bottom: 2px solid #e94560;
  flex-shrink: 0; flex-wrap: wrap;
}
#bar h2 { font-size: 13px; color: #e94560; white-space: nowrap; }
#stem-label {
  font-size: 11px; color: #80b4ff; flex: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.btn {
  padding: 4px 11px; border-radius: 4px; border: none;
  font-size: 12px; font-weight: 600; cursor: pointer;
  background: #0f3460; color: #e0e0e0;
}
.btn:hover { opacity: .8; }
#zoom-label { font-size: 12px; min-width: 40px; text-align: center; }
#wrap {
  flex: 1; overflow: auto; display: flex;
  align-items: flex-start; justify-content: center;
  padding: 8px; min-height: 0; background: #0a0a1a;
}
#img { display: block; cursor: grab; user-select: none; max-width: none; }
#img.grabbing { cursor: grabbing; }
#msg { color: #666; font-size: 14px; align-self: center; }
</style>
</head>
<body>
<div id="bar">
  <h2>🖼 Page view</h2>
  <span id="stem-label">—</span>
  <button class="btn" onclick="zoom(-0.2)">−</button>
  <span id="zoom-label">100%</span>
  <button class="btn" onclick="zoom(+0.2)">+</button>
  <button class="btn" onclick="fit()">Fit</button>
  <button class="btn" onclick="nav(-1)">◀</button>
  <button class="btn" onclick="nav(+1)">▶</button>
</div>
<div id="wrap">
  <img id="img" src="" alt="" onload="onImgLoad()" onerror="onImgErr()">
  <span id="msg" style="display:none;">No image</span>
</div>

<script>
const params = new URLSearchParams(location.search);
const FOLDER = params.get('folder') || '';
let   STEMS  = [];
try { STEMS = JSON.parse(params.get('stems') || '[]'); } catch(e) {}
let cur = params.get('stem') || STEMS[0] || '';
let z   = 1;
let drag = null;

function imgUrl(stem) {
  return '/api/image?folder=' + encodeURIComponent(FOLDER)
       + '&stem='   + encodeURIComponent(stem);
}

function goTo(stem) {
  if (!stem) return;
  cur = stem;
  document.title = 'Page view — ' + stem;
  document.getElementById('stem-label').textContent = stem;
  document.getElementById('img').style.display = 'block';
  document.getElementById('msg').style.display = 'none';
  document.getElementById('img').src = imgUrl(stem);
  document.getElementById('wrap').scrollTo(0, 0);
  // Notify opener so clicking row numbers still works
  if (window.opener && !window.opener.closed) {
    try { window.opener._activeStem = stem; } catch(e) {}
  }
}
// Called by the opener to switch pages
window.goTo = goTo;

function nav(d) {
  const i = STEMS.indexOf(cur);
  const n = i + d;
  if (n >= 0 && n < STEMS.length) goTo(STEMS[n]);
}

function onImgLoad() { fit(); }
function onImgErr() {
  document.getElementById('img').style.display = 'none';
  document.getElementById('msg').style.display = '';
  document.getElementById('msg').textContent = 'Image not found: ' + cur;
}

function fit() {
  const img  = document.getElementById('img');
  const wrap = document.getElementById('wrap');
  if (!img.naturalWidth) return;
  const sw = (wrap.clientWidth  - 16) / img.naturalWidth;
  const sh = (wrap.clientHeight - 16) / img.naturalHeight;
  z = Math.min(sw, sh, 1);
  applyZoom();
}

function zoom(delta) {
  z = Math.max(0.1, Math.min(8, z + delta));
  applyZoom();
}

function applyZoom() {
  const img = document.getElementById('img');
  img.style.width  = (img.naturalWidth  * z) + 'px';
  img.style.height = (img.naturalHeight * z) + 'px';
  document.getElementById('zoom-label').textContent = Math.round(z * 100) + '%';
}

// Drag-to-pan
const wrap = document.getElementById('wrap');
const img  = document.getElementById('img');
img.addEventListener('mousedown', e => {
  drag = { x: e.clientX, y: e.clientY, sl: wrap.scrollLeft, st: wrap.scrollTop };
  img.classList.add('grabbing');
  e.preventDefault();
});
window.addEventListener('mousemove', e => {
  if (!drag) return;
  wrap.scrollLeft = drag.sl - (e.clientX - drag.x);
  wrap.scrollTop  = drag.st - (e.clientY - drag.y);
});
window.addEventListener('mouseup', () => {
  drag = null;
  img.classList.remove('grabbing');
});

// Scroll-wheel zoom
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  zoom(e.deltaY < 0 ? 0.15 : -0.15);
}, { passive: false });

// Keyboard navigation
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown') nav(+1);
  if (e.key === 'ArrowLeft'  || e.key === 'PageUp')   nav(-1);
  if (e.key === '+' || e.key === '=') zoom(+0.2);
  if (e.key === '-') zoom(-0.2);
  if (e.key === '0') fit();
});

// Boot
goTo(cur);
</script>
</body>
</html>
