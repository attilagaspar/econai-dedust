<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EconAI — Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }

header {
  background: #16213e;
  border-bottom: 1px solid #0f3460;
  padding: 14px 28px;
  display: flex; align-items: center; gap: 16px;
}
header h1 { font-size: 1.3rem; font-weight: 600; color: #e94560; letter-spacing: 1px; }
header span { color: #888; font-size: 0.85rem; }

.layout { display: flex; height: calc(100vh - 53px); }

/* ── LEFT PANEL: project list ── */
.sidebar {
  width: 340px; flex-shrink: 0;
  background: #16213e;
  border-right: 1px solid #0f3460;
  display: flex; flex-direction: column;
}
.sidebar-header {
  padding: 14px 16px 10px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid #0f3460;
}
.sidebar-header h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #888; }
#btn-new-project {
  background: #e94560; color: #fff; border: none; border-radius: 4px;
  padding: 5px 11px; font-size: 0.8rem; cursor: pointer; font-weight: 600;
}
#btn-new-project:hover { background: #c73652; }

#project-list { flex: 1; overflow-y: auto; }
.project-row {
  padding: 12px 16px;
  cursor: pointer;
  border-bottom: 1px solid #0d1b35;
  transition: background 0.1s;
}
.project-row:hover { background: #1d2e50; }
.project-row.active { background: #0f3460; border-left: 3px solid #e94560; }
.project-row .proj-name { font-weight: 600; font-size: 0.95rem; }
.project-row .proj-meta { font-size: 0.75rem; color: #888; margin-top: 3px; display: flex; gap: 12px; }
.project-row .stage-pill {
  display: inline-block; font-size: 0.7rem; padding: 1px 7px; border-radius: 10px;
  font-weight: 600; margin-top: 5px;
}

/* ── RIGHT PANEL: project detail ── */
.detail {
  flex: 1; overflow-y: auto;
  padding: 24px 32px;
  background: #1a1a2e;
}
.detail h2 { font-size: 1.4rem; margin-bottom: 6px; }
.detail .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 24px; }

.card {
  background: #16213e;
  border: 1px solid #0f3460;
  border-radius: 8px;
  padding: 20px 24px;
  margin-bottom: 20px;
}
.card h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 14px; }

/* Pipeline progress bar */
.pipeline-stages { display: flex; flex-wrap: wrap; gap: 6px; }
.ps {
  padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: 600;
  border: 1px solid #333;
  color: #888; background: #1a1a2e;
}
.ps.done-stage { color: #4caf50; border-color: #4caf50; }
.ps.current-stage { color: #fff; background: #e94560; border-color: #e94560; }
.ps.future-stage { color: #555; border-color: #333; }

/* Buttons */
.btn {
  border: none; border-radius: 5px; cursor: pointer; font-size: 0.82rem; padding: 7px 16px; font-weight: 600;
  transition: opacity 0.15s;
}
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-primary   { background: #e94560; color: #fff; }
.btn-secondary { background: #0f3460; color: #ccc; }
.btn-success   { background: #4caf50; color: #fff; }
.btn-warning   { background: #ff9800; color: #000; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

/* Form fields */
.field-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.field-row label { width: 110px; font-size: 0.8rem; color: #aaa; flex-shrink: 0; }
.field-row input, .field-row select {
  flex: 1; background: #0d1b35; border: 1px solid #0f3460; color: #e0e0e0;
  border-radius: 4px; padding: 6px 10px; font-size: 0.85rem;
}
.field-row input:focus, .field-row select:focus { outline: none; border-color: #e94560; }

/* Log box */
#job-log {
  background: #0d1020; border: 1px solid #0f3460; border-radius: 5px;
  padding: 12px; font-family: monospace; font-size: 0.78rem; color: #a0c8a0;
  min-height: 80px; max-height: 260px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
  margin-top: 12px;
}

/* Status indicator */
.status-dot {
  width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px;
}
.dot-green  { background: #4caf50; }
.dot-yellow { background: #ff9800; animation: blink 1.2s infinite; }
.dot-red    { background: #e94560; }
.dot-grey   { background: #555; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* Empty state */
.empty { text-align: center; padding: 60px 20px; color: #555; }
.empty .big { font-size: 3rem; margin-bottom: 12px; }

/* Modal */
.modal-bg {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  z-index: 100; align-items: center; justify-content: center;
}
.modal-bg.open { display: flex; }
.modal {
  background: #16213e; border: 1px solid #0f3460; border-radius: 10px;
  padding: 28px; width: 420px; max-width: 95vw;
}
.modal h3 { margin-bottom: 18px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

/* Live-log modal */
.log-modal {
  background: #0d1020; border: 1px solid #0f3460; border-radius: 10px;
  width: 780px; max-width: 96vw; max-height: 88vh;
  display: flex; flex-direction: column;
}
.log-modal-header {
  padding: 14px 20px; border-bottom: 1px solid #0f3460;
  display: flex; justify-content: space-between; align-items: center;
}
.log-modal-header h3 { font-size: 1rem; }
.log-modal-body {
  flex: 1; overflow-y: auto; padding: 14px 16px;
  font-family: monospace; font-size: 0.78rem; color: #a0c8a0;
  white-space: pre-wrap; word-break: break-all;
  min-height: 200px;
}
.log-modal-footer {
  padding: 10px 20px; border-top: 1px solid #0f3460;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 0.8rem; color: #888;
}

/* Import result list */
.import-results {
  margin-top: 12px; max-height: 140px; overflow-y: auto;
  font-size: 0.78rem; color: #888;
}
.import-results .ok  { color: #4caf50; }
.import-results .err { color: #e94560; }
</style>
</head>
<body>

<header>
  <h1>EconAI</h1>
  <span>Historical document digitization pipeline</span>
</header>

<div class="layout">

  <!-- ── LEFT: project list ── -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Projects</h2>
      <button id="btn-new-project" onclick="openNewProjectModal()">+ New</button>
    </div>
    <div id="project-list">
      <div class="empty"><div class="big">📂</div>Loading…</div>
    </div>
  </div>

  <!-- ── RIGHT: detail panel ── -->
  <div class="detail" id="detail-panel">
    <div class="empty">
      <div class="big">👈</div>
      <div>Select a project to view details</div>
    </div>
  </div>

</div>

<!-- Live-log modal -->
<div class="modal-bg" id="log-modal-bg">
  <div class="log-modal">
    <div class="log-modal-header">
      <h3 id="log-modal-title">Server log</h3>
      <span id="log-modal-status"></span>
    </div>
    <div class="log-modal-body" id="log-modal-body"></div>
    <div class="log-modal-footer">
      <span id="log-modal-info">Connecting…</span>
      <button class="btn btn-secondary" id="log-modal-close" onclick="closeLogModal()">Close</button>
    </div>
  </div>
</div>

<!-- New-project modal -->
<div class="modal-bg" id="new-project-modal">
  <div class="modal">
    <h3>New Project</h3>
    <div class="field-row">
      <label>Name</label>
      <input id="np-name" placeholder="e.g. machines1935" />
    </div>
    <div class="field-row">
      <label>Type</label>
      <select id="np-type">
        <option value="A">A — Tables (statistical yearbooks)</option>
        <option value="B">B — Structured text (company registers)</option>
      </select>
    </div>
    <div class="field-row">
      <label>Labels</label>
      <input id="np-labels" placeholder="label1 label2 label3  (space-separated)" />
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeNewProjectModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitNewProject()">Create</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// State
// ============================================================
let projects   = [];
let activeProj = null;
let jobPollTimer = null;

const STAGE_COLORS = {
  raw:            '#555',
  annotating:     '#9c27b0',
  training:       '#ff9800',
  predicting:     '#ff9800',
  correcting:     '#2196f3',
  superstructure: '#2196f3',
  ocr:            '#00bcd4',
  llm_cleaning:   '#00bcd4',
  validating:     '#4caf50',
  exporting:      '#8bc34a',
  done:           '#4caf50',
};

// ============================================================
// Boot
// ============================================================
loadProjects();

async function loadProjects() {
  const res  = await fetch('/api/projects');
  const data = await res.json();
  projects   = data.projects || [];
  renderProjectList();
}

// ============================================================
// Sidebar rendering
// ============================================================
function renderProjectList() {
  const el = document.getElementById('project-list');
  if (!projects.length) {
    el.innerHTML = `<div class="empty"><div class="big">📂</div>No projects yet.<br>Click <b>+ New</b> to create one.</div>`;
    return;
  }
  el.innerHTML = projects.map(p => {
    const color = STAGE_COLORS[p.stage] || '#888';
    const active = activeProj && activeProj.name === p.name ? 'active' : '';
    return `
      <div class="project-row ${active}" onclick="selectProject('${p.name}')">
        <div class="proj-name">${p.name}</div>
        <div class="proj-meta">
          <span>Type ${p.type}</span>
          <span>${p.pages} pages</span>
          <span>${p.updated ? p.updated.slice(0,10) : ''}</span>
        </div>
        <span class="stage-pill" style="background:${color}22;color:${color};border-color:${color}55">
          ${p.stage}
        </span>
      </div>`;
  }).join('');
}

// ============================================================
// Project detail
// ============================================================
async function selectProject(name) {
  const res  = await fetch(`/api/project/${name}`);
  const data = await res.json();
  activeProj = { name, ...data };
  renderProjectList(); // re-render sidebar to update active highlight
  renderDetail();
}

function renderDetail() {
  if (!activeProj) return;
  const { config: cfg, pipeline: pl, stats, stages, annotations_path } = activeProj;
  const detail = document.getElementById('detail-panel');

  const stagesHtml = stages.map(s => {
    const idx_s = stages.indexOf(s);
    const idx_c = stages.indexOf(pl.stage);
    let cls = idx_s < idx_c ? 'done-stage' : idx_s === idx_c ? 'current-stage' : 'future-stage';
    return `<span class="ps ${cls}">${s}</span>`;
  }).join('');

  const srv = cfg.server || {};
  const connStatus = srv.host
    ? `<span class="status-dot dot-grey"></span>${srv.user}@${srv.host}`
    : '<span class="status-dot dot-grey"></span>Not configured';

  detail.innerHTML = `
    <h2>${cfg.name}</h2>
    <div class="subtitle">Type ${cfg.type} &nbsp;·&nbsp; ${cfg.type === 'A' ? 'Tables' : 'Structured text'} &nbsp;·&nbsp; ${stats.json} pages (${stats.images} images)</div>

    <!-- Pipeline progress -->
    <div class="card">
      <h3>Pipeline</h3>
      <div class="pipeline-stages">${stagesHtml}</div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="openEditor()">📝 Open Editor</button>
        <button class="btn btn-secondary" onclick="advanceStage()">▶ Advance Stage</button>
      </div>
    </div>

    <!-- Import pages -->
    <div class="card">
      <h3>Import Pages</h3>
      <p style="font-size:0.82rem;color:#888;margin-bottom:12px">
        Enter the path to a PDF, image file, or folder of files on your computer.<br>
        PDFs are split into pages automatically.
      </p>
      <div class="field-row">
        <label>Folder path</label>
        <input id="import-path" placeholder="C:/Users/you/Documents/scans" />
        <input type="file" id="folder-picker" webkitdirectory multiple style="display:none"
               onchange="fillPathFromPicker(this)">
        <button class="btn btn-secondary" style="white-space:nowrap"
                onclick="document.getElementById('folder-picker').click()">📁 Browse</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="importFromPath()">📥 Import</button>
      </div>
      <div class="import-results" id="import-results"></div>
    </div>

    <!-- Prepare training data -->
    <div class="card">
      <h3>Prepare Training Data</h3>
      <p style="font-size:0.82rem;color:#888;margin-bottom:12px">
        Converts your annotated LabelMe JSONs to COCO format and generates the training &amp; inference scripts.
        Run this after annotating a subset of pages in the editor.
      </p>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="prepareTrainingData()">⚙ Prepare training data</button>
      </div>
      <div id="prepare-result" style="font-size:0.8rem;color:#888;margin-top:10px"></div>
    </div>

    <!-- Train & Infer -->
    <div class="card">
      <h3>Train &amp; Infer on GPU Server</h3>
      <p style="font-size:0.82rem;color:#888;margin-bottom:12px">
        Pushes data to the server, runs training or inference inside Docker, and streams the live log.
      </p>
      <div class="btn-row">
        <button class="btn btn-warning" onclick="runTrain()">🚀 Train model</button>
        <button class="btn btn-success" onclick="runInfer()">🔍 Run inference</button>
        <button class="btn btn-secondary" onclick="pullPredictions()">⬇ Pull predictions</button>
      </div>
    </div>

    <!-- Server config -->
    <div class="card">
      <h3>GPU Server &nbsp;<small id="conn-status-label">${connStatus}</small></h3>
      <div class="field-row">
        <label>Host</label>
        <input id="srv-host" value="${srv.host||''}" placeholder="gpu.myuni.edu" />
      </div>
      <div class="field-row">
        <label>User</label>
        <input id="srv-user" value="${srv.user||''}" placeholder="username" />
      </div>
      <div class="field-row">
        <label>Key file</label>
        <input id="srv-key"  value="${srv.key_path||''}" placeholder="C:/Users/you/.ssh/id_rsa" />
      </div>
      <div class="field-row">
        <label>Remote path</label>
        <input id="srv-remote" value="${srv.remote_path||''}" placeholder="/home/user/econai" />
      </div>
      <div class="field-row">
        <label>Passphrase</label>
        <input id="srv-pass" type="password" placeholder="(leave blank if key has no passphrase)" />
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="saveServerConfig()">💾 Save</button>
        <button class="btn btn-secondary" onclick="testConnection()">🔌 Test connection</button>
      </div>
    </div>
  `;

  // If there's a running job, start polling
  if (pl.job) {
    document.getElementById('job-cmd').value = pl.job.command || '';
    startJobPolling();
  }
}

// ============================================================
// Editor
// ============================================================
function openEditor() {
  if (!activeProj) return;
  const ann = activeProj.annotations_path.replaceAll('\\', '/');
  window.location.href = `/static/index.html?folder=${encodeURIComponent(ann)}`;
}

// ============================================================
// Pipeline stage
// ============================================================
async function advanceStage() {
  if (!activeProj) return;
  if (!confirm(`Advance "${activeProj.name}" to the next stage?`)) return;
  const res  = await fetch(`/api/project/${activeProj.name}/advance`, { method: 'POST' });
  const data = await res.json();
  if (data.ok) {
    await selectProject(activeProj.name);
  } else {
    alert('Error: ' + (data.detail || JSON.stringify(data)));
  }
}

// ============================================================
// Server config
// ============================================================
function getPassphrase() {
  const el = document.getElementById('srv-pass');
  return el ? el.value : '';
}

async function saveServerConfig() {
  if (!activeProj) return;
  const body = {
    server: {
      host:        document.getElementById('srv-host').value.trim(),
      user:        document.getElementById('srv-user').value.trim(),
      key_path:    document.getElementById('srv-key').value.trim().replace(/^["']+|["']+$/g, ''),
      remote_path: document.getElementById('srv-remote').value.trim(),
    }
  };
  const res  = await fetch(`/api/project/${activeProj.name}/config`, {
    method: 'PATCH', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (data.ok) {
    activeProj.config.server = data.config.server;
    showToast('Server settings saved.');
  } else {
    alert('Error: ' + (data.detail || JSON.stringify(data)));
  }
}

async function testConnection() {
  const label = document.getElementById('conn-status-label');
  if (!label) return;
  await saveServerConfig();
  label.innerHTML = `<span class="status-dot dot-yellow"></span>Testing…`;
  const res  = await fetch(`/api/project/${activeProj.name}/server/test`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ passphrase: getPassphrase() }),
  });
  const data = await res.json();
  if (data.ok) {
    label.innerHTML = `<span class="status-dot dot-green"></span>${data.hostname} &nbsp;·&nbsp; GPU: ${data.gpu || 'n/a'}`;
  } else {
    label.innerHTML = `<span class="status-dot dot-red"></span>${data.error || 'Connection failed'}`;
  }
}

// ============================================================
// File import
// ============================================================
function fillPathFromPicker(input) {
  if (!input.files.length) return;
  // webkitRelativePath = "foldername/file.pdf" — extract the folder name
  // but we need the full OS path, which the browser won't give us.
  // Best we can do: fill the folder name so the user can correct it.
  const rel  = input.files[0].webkitRelativePath;
  const folder = rel.split('/')[0];
  const el   = document.getElementById('import-path');
  // If input already has a value that ends with this folder, leave it
  if (!el.value.endsWith(folder)) {
    el.value = folder;
    el.focus();
    el.setSelectionRange(0, el.value.length);
  }
  showToast(`Folder "${folder}" selected — verify the full path then click Import.`, 5000);
}

async function importFromPath() {
  if (!activeProj) return;
  const path    = document.getElementById('import-path').value.trim();
  if (!path) { alert('Enter a path first.'); return; }
  const results = document.getElementById('import-results');
  results.innerHTML = '<div>Importing…</div>';
  const res  = await fetch(`/api/project/${activeProj.name}/import`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ source_path: path }),
  });
  const data = await res.json();
  if (data.ok) {
    results.innerHTML = data.pages.map(p =>
      p.error
        ? `<div class="err">✗ ${p.stem}: ${p.error}</div>`
        : `<div class="ok">✓ ${p.stem} (${p.width}×${p.height})</div>`
    ).join('');
    showToast(`Imported ${data.total} page(s).`);
    await selectProject(activeProj.name);
  } else {
    results.innerHTML = `<div class="err">${data.detail || JSON.stringify(data)}</div>`;
  }
}

// ============================================================
// Prepare training data
// ============================================================
async function prepareTrainingData() {
  if (!activeProj) return;
  const el = document.getElementById('prepare-result');
  el.textContent = 'Converting annotations…';
  const res  = await fetch(`/api/project/${activeProj.name}/prepare`, { method: 'POST' });
  const data = await res.json();
  if (data.ok) {
    el.innerHTML = `✓ ${data.n_annotated} annotated pages · ${data.n_annotations} boxes · ${data.n_classes} labels<br>
      COCO JSON, config YAML, and training scripts saved to <code>intermediate/</code>`;
    showToast('Training data prepared.');
  } else {
    el.textContent = 'Error: ' + (data.detail || JSON.stringify(data));
  }
}

// ============================================================
// Train / Infer (SSE live log)
// ============================================================
let activeSSE = null;

function openLogModal(title) {
  document.getElementById('log-modal-title').textContent = title;
  document.getElementById('log-modal-body').textContent  = '';
  document.getElementById('log-modal-info').textContent  = 'Connecting…';
  document.getElementById('log-modal-status').innerHTML  =
    '<span class="status-dot dot-yellow"></span>Running';
  document.getElementById('log-modal-bg').classList.add('open');
}

function closeLogModal() {
  document.getElementById('log-modal-bg').classList.remove('open');
  if (activeSSE) { activeSSE.close(); activeSSE = null; }
}

function startSSE(url, title, passphrase) {
  openLogModal(title);
  const body   = document.getElementById('log-modal-body');
  const info   = document.getElementById('log-modal-info');
  const status = document.getElementById('log-modal-status');

  // POST first to start job, then use EventSource (GET) for SSE stream
  // Since EventSource doesn't support POST, we POST with fetch using streaming
  const ctrl = new AbortController();
  activeSSE  = ctrl;

  fetch(url, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ passphrase }),
    signal:  ctrl.signal,
  }).then(async res => {
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      body.textContent += '\nError: ' + (err.detail || res.statusText);
      status.innerHTML = '<span class="status-dot dot-red"></span>Error';
      return;
    }
    const reader = res.body.getReader();
    const dec    = new TextDecoder();
    let   buf    = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        const match = part.match(/^data: (.+)$/m);
        if (!match) continue;
        try {
          const msg = JSON.parse(match[1]);
          if (msg.done) {
            status.innerHTML = '<span class="status-dot dot-green"></span>Done';
            info.textContent = 'Completed.';
            return;
          }
          if (msg.error) {
            body.textContent += '\nError: ' + msg.error;
            status.innerHTML = '<span class="status-dot dot-red"></span>Error';
            return;
          }
          if (msg.line !== undefined) {
            body.textContent += msg.line + '\n';
            body.scrollTop    = body.scrollHeight;
          }
        } catch {}
      }
    }
    status.innerHTML = '<span class="status-dot dot-green"></span>Done';
    info.textContent = 'Stream ended.';
  }).catch(err => {
    if (err.name !== 'AbortError') {
      body.textContent += '\nConnection error: ' + err.message;
      status.innerHTML = '<span class="status-dot dot-red"></span>Error';
    }
  });
}

// ============================================================
// Job submission & polling
// ============================================================
async function submitJob() {
  if (!activeProj) return;
  await saveServerConfig();
  const cmd = document.getElementById('job-cmd').value.trim();
  if (!cmd) { alert('Enter a command first.'); return; }
  const log = document.getElementById('job-log');
  log.textContent = 'Submitting job…';
  const res  = await fetch(`/api/project/${activeProj.name}/job/submit`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ command: cmd, passphrase: getPassphrase() }),
  });
  const data = await res.json();
  if (data.ok) {
    log.textContent = `Job started — PID ${data.pid}\nLog: ${data.log_path}\n\nWaiting for output…`;
    startJobPolling();
  } else {
    log.textContent = 'Error: ' + (data.error || JSON.stringify(data));
  }
}

function startJobPolling() {
  if (jobPollTimer) return;
  jobPollTimer = setInterval(pollJobStatus, 5000);
  pollJobStatus();
}

function stopJobPolling() {
  if (jobPollTimer) { clearInterval(jobPollTimer); jobPollTimer = null; }
}

async function pollJobStatus() {
  if (!activeProj) return;
  const pass = encodeURIComponent(getPassphrase());
  const res  = await fetch(`/api/project/${activeProj.name}/job/status?passphrase=${pass}`);
  const data = await res.json();
  const log  = document.getElementById('job-log');
  if (!log) { stopJobPolling(); return; }
  if (!data.ok) {
    log.textContent = 'Error: ' + (data.error || JSON.stringify(data));
    stopJobPolling();
    return;
  }
  const header = data.running
    ? `● JOB RUNNING  PID ${data.pid}  Log: ${data.log_path}\n${'─'.repeat(60)}\n`
    : `■ JOB FINISHED  PID ${data.pid}  Log: ${data.log_path}\n${'─'.repeat(60)}\n`;
  log.textContent = header + (data.log_tail || '(empty log)');
  log.scrollTop = log.scrollHeight;
  if (!data.running) stopJobPolling();
}

function openNewProjectModal() {
  document.getElementById('new-project-modal').classList.add('open');
  document.getElementById('np-name').focus();
}
function closeNewProjectModal() {
  document.getElementById('new-project-modal').classList.remove('open');
}
async function submitNewProject() {
  const name   = document.getElementById('np-name').value.trim();
  const type   = document.getElementById('np-type').value;
  const labels = document.getElementById('np-labels').value.trim().split(/\s+/).filter(Boolean);
  if (!name) { alert('Name is required.'); return; }

  const res  = await fetch('/api/project/new', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ name, type, labels }),
  });
  const data = await res.json();
  if (data.ok) {
    closeNewProjectModal();
    await loadProjects();
    selectProject(name);
  } else {
    alert('Error: ' + (data.detail || JSON.stringify(data)));
  }
}

// ============================================================
// Toast notification
// ============================================================
let toastTimer = null;
let toastEl    = null;

function showToast(msg, duration = 3000, color = 'green') {
  if (!toastEl) {
    toastEl = document.createElement('div');
    toastEl.style.cssText = `
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
      background:#222; color:#fff; padding:10px 22px; border-radius:20px;
      font-size:0.85rem; z-index:999; border:1px solid #444;
      transition: opacity 0.3s;
    `;
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = msg;
  toastEl.style.borderColor = color === 'red' ? '#e94560' : '#4caf50';
  toastEl.style.opacity = '1';
  if (toastTimer) clearTimeout(toastTimer);
  if (duration > 0) {
    toastTimer = setTimeout(() => { if (toastEl) toastEl.style.opacity = '0'; }, duration);
  }
}
function clearToast() { if (toastEl) toastEl.style.opacity = '0'; }

// Keyboard shortcut: Escape closes modals
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeNewProjectModal(); closeLogModal(); }
});

// Prevent browser from opening dropped files anywhere on the page
document.addEventListener('dragover',  e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); });
